<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div id="login-container" class="login-container">
        <div class="login-box">
            <h1>Admin Login</h1>
            <form id="login-form" onsubmit="handleLogin(event)">
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter admin password" 
                    required
                    autofocus
                >
                <button type="submit">Login</button>
            </form>
            <p id="login-error" class="error-message"></p>
        </div>
    </div>

    <div id="admin-panel" class="admin-panel hidden">
        <nav class="admin-navbar">
            <h1>Photo Gallery Admin</h1>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </nav>

        <div class="admin-content">
            <section class="folders-section">
                <div class="section-header-row">
                    <h2>Folders</h2>
                    <button onclick="saveFolderOrder()" class="btn-primary btn-small" id="save-folder-order-btn">Save Order</button>
                </div>
                <div class="folder-controls">
                    <div class="new-folder-form">
                        <input 
                            type="text" 
                            id="new-folder-name" 
                            placeholder="New folder name"
                        >
                        <button onclick="createFolder()" class="btn-primary">Create Folder</button>
                    </div>
                    <p id="folder-message" class="message"></p>
                </div>
                <div id="folders-list" class="folders-list">
                    <!-- Folders will be loaded here -->
                </div>
            </section>

            <section class="landing-images-section">
                <div class="section-header-row">
                    <h2>Home Page Images</h2>
                    <button onclick="saveLandingImageOrder()" class="btn-primary btn-small" id="save-landing-order-btn">Save Order</button>
                </div>
                <form id="landing-upload-form" onsubmit="handleLandingUpload(event)">
                    <div class="file-input-wrapper">
                        <input
                            type="file"
                            id="landing-image-file"
                            accept="image/*,video/*"
                            multiple
                            required
                            onchange="handleLandingFileSelect(event)"
                        >
                        <label for="landing-image-file">Choose Home Page Images</label>
                        <span id="landing-file-name">No files selected</span>
                    </div>
                    <button type="submit" class="upload-btn">Upload Home Images</button>
                    <div class="upload-progress" id="landing-upload-progress" hidden>
                        <div class="upload-progress-header"><span>Uploading</span><span class="upload-progress-value">0%</span></div>
                        <div class="upload-progress-track"><div class="upload-progress-bar"></div></div>
                    </div>
                </form>
                <div id="landing-preview-container" class="preview-container"></div>
                <div id="landing-images-list" class="landing-images-list"></div>
                <p id="landing-message" class="message"></p>
            </section>

            <section class="upload-section">
                <h2>Upload Photos</h2>
                <form id="upload-form" onsubmit="handleUpload(event)">
                    <div>
                        <label for="folder-select">Select Folder:</label>
                        <select id="folder-select" required>
                            <option value="">-- Choose a folder --</option>
                        </select>
                    </div>
                    <div class="file-input-wrapper">
                        <input 
                            type="file" 
                            id="photo-file" 
                            accept="image/*,video/*"
                            multiple
                            required
                            onchange="handleFileSelect(event)"
                        >
                        <label for="photo-file">Choose Images or Videos</label>
                        <span id="file-name">No files selected</span>
                    </div>
                    <button type="submit" class="upload-btn">Upload Images or Videos</button>
                    <div class="upload-progress" id="upload-progress" hidden>
                        <div class="upload-progress-header"><span>Uploading</span><span class="upload-progress-value">0%</span></div>
                        <div class="upload-progress-track"><div class="upload-progress-bar"></div></div>
                    </div>
                </form>
                <div id="preview-container" class="preview-container"></div>
                <p id="upload-message" class="message"></p>
            </section>
        </div>
    </div>

    <script src="admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</body>
</html>
